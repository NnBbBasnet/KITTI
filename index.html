<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
/* STATE */
const CURRENCY='NPR', STORAGE_KEY='felt-ledger-v1';
const DEFAULT={screen:'home',game:null,settings:{boot:10},players:[],rounds:[],activeRound:null,sound:false};
let state=loadState(), toastTimer;
function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!saved||!Array.isArray(saved.players))return structuredClone(DEFAULT);if(saved.game&&saved.game!=='kitty'){localStorage.setItem('felt-ledger-removed-game-backup-v1',JSON.stringify(saved));return structuredClone(DEFAULT)}return {...structuredClone(DEFAULT),...saved,game:saved.game?'kitty':null,settings:{boot:validAmount(saved.settings?.boot??DEFAULT.settings.boot)},rounds:Array.isArray(saved.rounds)?saved.rounds.map(round=>{const normalized={...round,stake:validAmount(round.stake??saved.settings?.boot??DEFAULT.settings.boot),salami:Boolean(round.salami||round.trio)};delete normalized.trio;return normalized}):[],activeRound:saved.activeRound||null}}catch{return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function fresh(){state=structuredClone(DEFAULT);save();render()}
function money(n){return `${CURRENCY} ${Math.round(Number(n)||0).toLocaleString('en-IN')}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,9)}
function notify(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function vibrate(){if(navigator.vibrate)navigator.vibrate(24)}
/* RULES ENGINE — all displayed balances are derived by replaying these events. */
function emptyLedger(){return {balances:Object.fromEntries(state.players.map(p=>[p.id,0])),won:Object.fromEntries(state.players.map(p=>[p.id,0])),paid:Object.fromEntries(state.players.map(p=>[p.id,0])),wins:Object.fromEntries(state.players.map(p=>[p.id,0])),packed:Object.fromEntries(state.players.map(p=>[p.id,0])),pot:0,kittyStreak:0,biggestPot:0,biggestPotWinner:null}}
function transfer(book,from,to,amount){amount=Math.round(amount||0);if(amount<=0)return;if(from==='pot'){book.pot-=amount}else{book.balances[from]-=amount;book.paid[from]+=amount}if(to==='pot'){book.pot+=amount}else{book.balances[to]+=amount;book.won[to]+=amount}}
function applyKittiRound(book,r){const stake=validAmount(r.stake??state.settings.boot);for(const player of state.players)transfer(book,player.id,'pot',stake);if(r.kind==='kitty'){book.kittyStreak++;for(const player of state.players)transfer(book,player.id,'pot',stake);return}book.kittyStreak=0;const pot=book.pot;transfer(book,'pot',r.winner,pot);book.wins[r.winner]++;book.biggestPot=Math.max(book.biggestPot,pot);if(pot>=book.biggestPot)book.biggestPotWinner=r.winner;for(const playerId of r.packed||[])book.packed[playerId]++;if(r.salami)for(const player of state.players){if(player.id!==r.winner&&!(r.packed||[]).includes(player.id))transfer(book,player.id,r.winner,stake)}}
function derive(){const ledger=emptyLedger();for(const round of state.rounds)applyKittiRound(ledger,round);if(state.activeRound){const stake=validAmount(state.activeRound.stake??state.settings.boot);for(const player of state.players)transfer(ledger,player.id,'pot',stake)}return ledger}
/* SETTLEMENT */
function settle(nets){let debtors=nets.filter(x=>x.net<0).map(x=>({...x,remaining:-x.net})).sort((a,b)=>b.remaining-a.remaining),creditors=nets.filter(x=>x.net>0).map(x=>({...x,remaining:x.net})).sort((a,b)=>b.remaining-a.remaining),lines=[];let i=0,j=0;while(i<debtors.length&&j<creditors.length){let amount=Math.min(debtors[i].remaining,creditors[j].remaining);if(amount>0)lines.push({from:debtors[i].name,to:creditors[j].name,amount});debtors[i].remaining-=amount;creditors[j].remaining-=amount;if(!debtors[i].remaining)i++;if(!creditors[j].remaining)j++}return lines}
/* RENDER */
function render(){if(state.game!=='kitty'&&state.screen!=='home'&&state.screen!=='setup'){state.screen='home';state.game=null}save();const root=document.querySelector('#app');if(state.screen==='home')root.innerHTML=renderHome();else if(state.screen==='setup')root.innerHTML=renderSetup();else if(state.screen==='dashboard')root.innerHTML=renderDashboard();else root.innerHTML=renderSettlement();}
function renderHome(){const canResume=state.players.length&&['dashboard','settlement'].includes(state.screen)&&state.game;return `<div class="wrap"><header class="topline"><div class="brand"><span class="brand-mark">♠</span> FELT <span style="color:var(--muted);font-weight:500">/ LEDGER</span></div><span class="eyebrow">Kathmandu · Table ready</span></header><main class="hero"><div class="eyebrow">The game is in the details</div><h1>Keep score.<br><em>Settle clean.</em></h1><p>A live money ledger for Kitti. Track each stake, Kitti carry-over and Salami payout, then settle the table.</p>${canResume?`<div class="resume"><div><b>Session in progress</b><br><span>Kitti · ${state.players.length} players · ${state.rounds.length} completed deals</span></div><button class="btn primary" onclick="resumeSession()">Resume ↗</button></div>`:''}<div class="game-grid"><button class="game-card" onclick="chooseGame()"><span class="suit">♠</span><h2>Kitti</h2><p>Stake, Kitti carry-overs and Salami payouts.</p></button></div><div class="hint">Cards stay on the table. The ledger handles the money.</div></main></div>`}
function gameName(){return 'Kitti'}
function chooseGame(){state.game='kitty';state.screen='setup';state.players=[];state.rounds=[];state.activeRound=null;render()}
function renderSetup(){return `<div class="wrap setup"><div class="setup-head"><button class="back" aria-label="Back to home" onclick="state.screen='home';render()">←</button><div><div class="eyebrow">Kitti · Session setup</div><h1>Kitti</h1></div></div><section class="form-card"><div class="section-title">Players <span class="hint">2–5 players</span></div><div id="player-list"></div><button class="btn small" onclick="addPlayerInput()">＋ Add player</button></section><section class="form-card"><div class="section-title">Stake</div><div class="field"><label for="boot">Stake per player, per deal</label><input id="boot" type="number" min="0" step="1" value="${state.settings.boot}" oninput="state.settings.boot=validAmount(this.value);markChip()"><div class="chips">${[5,10,20,50,100].map(amount=>`<button class="chip ${Number(state.settings.boot)===amount?'active':''}" onclick="setSetupAmount('boot',${amount})">${amount}</button>`).join('')}</div><span class="hint">The Salami extra payment is one additional stake per non-packed loser.</span></div></section><div class="start-row"><button class="btn primary" onclick="startSession()">Start session →</button></div></div>`}
function addPlayerInput(name=''){const list=document.querySelector('#player-list');if(!list)return;const row=document.createElement('div');row.className='player-input';row.innerHTML=`<input class="text-input" placeholder="Player name" maxlength="24" value="${esc(name)}" aria-label="Player name"><button class="remove-player" aria-label="Remove player" onclick="this.parentElement.remove()">×</button>`;list.append(row)}
function validAmount(v){const n=Number(v);return Number.isFinite(n)&&n>=0?Math.round(n):0}
function setSetupAmount(key,v){state.settings[key]=validAmount(v);const input=document.querySelector('#boot');if(input)input.value=state.settings[key];markChip()}
function markChip(){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',Number(x.textContent)===Number(state.settings.boot)))}
function startSession(){const names=[...document.querySelectorAll('.player-input input')].map(input=>input.value.trim());if(names.length<2||names.length>5){notify('Add 2 to 5 players.');return}if(names.some(name=>!name)){notify('Every player needs a name.');return}if(new Set(names.map(name=>name.toLowerCase())).size!==names.length){notify('Player names must be unique.');return}state.settings.boot=validAmount(state.settings.boot);state.players=names.map(name=>({id:id(),name}));state.rounds=[];state.activeRound=null;state.screen='dashboard';save();render()}
function resumeSession(){state.screen='dashboard';render()}
function renderDashboard(){const book=derive(),ranked=state.players.slice().sort((a,b)=>book.balances[b.id]-book.balances[a.id]),max=Math.max(1,...ranked.map(p=>Math.abs(book.balances[p.id]))),leader=ranked[0],loser=ranked[ranked.length-1];return `<div class="dashbar"><div class="wrap dashbar-inner"><div class="brand"><span class="brand-mark">${'♠'}</span></div><div class="dash-title"><strong>${gameName()}</strong><small>Deal ${state.rounds.length+1}</small></div><div class="pot"><small>Board / Pot</small><b>${money(book.pot)}</b></div><div class="dash-actions"><button class="icon-btn" aria-label="Undo last deal" title="Undo last deal" onclick="undoRound()">↶</button><button class="icon-btn" aria-label="Settings" title="Settings" onclick="showSettings()">⚙</button><button class="btn small" onclick="endSession()">End session</button></div></div></div><main class="wrap dashboard-main"><h1>The table</h1><div class="dash-sub">${state.rounds.length?`Live after ${state.rounds.length} ${state.rounds.length===1?'deal':'deals'}. Ledger updates as each result lands.`:'Session is ready. Start the first round when the table is set.'}</div><div class="stats"><div class="stat"><small>Biggest pot won</small><b>${money(book.biggestPot)}</b></div><div class="stat"><small>Kitty streak</small><b>${book.kittyStreak} ${book.kittyStreak===1?'deal':'deals'}</b></div><div class="stat"><small>Current winner</small><b>${leader&&book.balances[leader.id]>0?esc(leader.name):'—'}</b></div><div class="stat"><small>Largest amount owed</small><b>${loser&&book.balances[loser.id]<0?esc(loser.name):'—'}</b></div></div><div class="leader-layout"><section><div class="leader-list">${ranked.map((p,i)=>{const b=book.balances[p.id],width=Math.max(7,Math.abs(b)/max*100);return `<article class="player-card ${i===0?'first':''} ${i===ranked.length-1&&ranked.length>1?'last':''}"><div class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div><div class="player-name">${i===0?'♛ ':''}${i===ranked.length-1&&ranked.length>1?'♨ ':''}${esc(p.name)}</div><div class="player-meta">Won ${money(book.won[p.id])} · Paid ${money(book.paid[p.id])} · ${book.wins[p.id]} wins · ${book.packed[p.id]} folded</div></div><div class="balance ${b>0?'positive':b<0?'negative':'zero'}">${b>0?'+':''}${money(b)}</div><div class="bar" style="width:${width}%"></div></article>`}).join('')}</div></section><aside class="panel action-panel"><div class="eyebrow">Next move</div><h3>${state.activeRound?'Outcome entry is open':'Ready for a round?'}</h3><p>${state.activeRound?'Choose the result below and confirm to update the ledger.':'Each player contributes one stake to the pot. A Kitti draw adds one extra stake from each player.'}</p><button class="btn primary" onclick="newRound()">＋ New deal</button><button class="btn subtle" onclick="endSession()">End session</button></aside></div><section class="panel history-panel"><div class="history-head"><h3>Deal history</h3><span class="hint">${state.rounds.length} recorded</span></div><div class="history">${state.rounds.length?state.rounds.slice().reverse().map((r,rev)=>historyCard(r,state.rounds.length-rev)).join(''):`<div class="empty">No deals yet. Start the first deal to begin the ledger.</div>`}</div></section></main>`}
function historyCard(round,num){const stake=validAmount(round.stake??state.settings.boot);return `<article class="round-item"><div><strong>Deal ${num} · ${round.kind==='kitty'?'Kitti — pot carried over':`Winner: ${esc(playerName(round.winner))}`}</strong><small>${round.kind==='kitty'?`No winner. An extra ${money(stake)} stake was collected from each player.`:round.salami?`Salami sweep · ${round.packed?.length?`Folded: ${round.packed.map(playerName).map(esc).join(', ')}`:'No one folded'}`:round.packed?.length?`Folded: ${round.packed.map(playerName).map(esc).join(', ')}`:'Winner takes the pot; no extra stake charged.'}</small></div><div class="round-amount">${round.kind==='kitty'?'↻ '+money(stake*state.players.length):'↑ '+money((round.potWon||0)+(round.salami?(round.packed||[]).filter(playerId=>playerId!==round.winner).length*stake:0))}</div></article>`}
function playerName(pid){return state.players.find(p=>p.id===pid)?.name||'Unknown'}
function newRound(){if(state.activeRound){openOutcome();return}state.activeRound={id:id(),startedAt:Date.now(),stake:validAmount(state.settings.boot)};save();render();vibrate();openOutcome()}
function cancelActiveRound(){state.activeRound=null;render()}
function openOutcome(){if(document.querySelector('#modal-backdrop'))return;if(!state.activeRound){notify('Start a new round first.');return}kittyModal()}
function modal(html){const el=document.createElement('div');el.className='modal-backdrop';el.id='modal-backdrop';el.innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}</section>`;el.addEventListener('click',e=>{if(e.target===el)el.remove()});document.body.append(el)}
function closeModal(){document.querySelector('#modal-backdrop')?.remove()}
function kittyModal(){modal(`<h2>How did it land?</h2><p class="intro">Choose the result for deal ${state.rounds.length+1}.</p><div class="radio-row"><button class="choice selected" id="winner-choice" onclick="selectOutcomeMode('winner')">♛<br>Winner</button><button class="choice" id="kitty-choice" onclick="selectOutcomeMode('kitty')">♧<br>Kitti</button><button class="choice" id="salami-choice" onclick="selectOutcomeMode('salami')">✦<br>Salami</button></div><div id="outcome-fields">${kittyFields()}</div><div class="modal-actions"><button class="btn subtle" onclick="closeModal()">Cancel</button><button class="btn primary" id="confirm-outcome" onclick="confirmKittyOutcome()">Confirm result</button></div>`)}
function kittyFields(){return `<div class="section-title">Select winner</div><div class="winner-grid">${state.players.map(player=>`<button type="button" class="winner-option" data-player-id="${player.id}" aria-pressed="false" onclick="selectWinner('${player.id}')"><span class="winner-crown" aria-hidden="true">♛</span><span class="winner-avatar">${esc(player.name.slice(0,1).toUpperCase())}</span><span class="winner-name">${esc(player.name)}</span></button>`).join('')}</div><div style="margin-top:17px"><div class="section-title">Who folded?</div><div class="player-select-grid">${state.players.map(player=>`<label class="check-option"><input type="checkbox" value="${player.id}" class="packed-check" onchange="validatePacked()"> ${esc(player.name)}</label>`).join('')}</div></div><div class="hint" style="margin-top:12px">A Salami is a three-show sweep. Each non-folded loser pays one additional stake.</div><div id="packed-warning" class="hint" role="status"></div>`}
function selectWinner(playerId){document.querySelectorAll('.winner-option').forEach(option=>{const selected=option.dataset.playerId===playerId;option.classList.toggle('selected',selected);option.setAttribute('aria-pressed',String(selected))});validatePacked()}
function selectOutcomeMode(mode){document.querySelector('#winner-choice').classList.toggle('selected',mode==='winner');document.querySelector('#kitty-choice').classList.toggle('selected',mode==='kitty');document.querySelector('#salami-choice').classList.toggle('selected',mode==='salami');const fields=document.querySelector('#outcome-fields'),confirm=document.querySelector('#confirm-outcome');if(mode==='kitty'){fields.innerHTML=`<div class="empty kitty-flash">Kitti draw: one extra stake is collected from every player and carried into the next deal.</div>`;confirm.textContent='Record Kitti';setTimeout(()=>{if(document.querySelector('#kitty-choice')?.classList.contains('selected'))confirmKittyOutcome()},500)}else{fields.innerHTML=kittyFields();confirm.textContent=mode==='salami'?'Confirm Salami sweep':'Confirm winner'}}
function validatePacked(){const winner=document.querySelector('.winner-option.selected')?.dataset.playerId,checked=[...document.querySelectorAll('.packed-check:checked')],warning=document.querySelector('#packed-warning');if(!winner){warning.textContent='Select a winner to continue.';return false}const invalid=checked.some(check=>check.value===winner);warning.textContent=invalid?'The winner cannot be marked as folded.':'';return !invalid}
function confirmKittyOutcome(){const mode=document.querySelector('#kitty-choice').classList.contains('selected')?'kitty':document.querySelector('#salami-choice').classList.contains('selected')?'salami':'winner';if(mode!=='kitty'&&!validatePacked())return;const stake=validAmount(state.activeRound.stake??state.settings.boot);if(mode==='kitty'){state.rounds.push({id:state.activeRound.id,kind:'kitty',stake});state.activeRound=null;closeModal();save();render();newRound();notify(`Kitti recorded · next deal stake ${money(state.settings.boot)} collected.`);return}const winner=document.querySelector('.winner-option.selected')?.dataset.playerId,packed=[...document.querySelectorAll('.packed-check:checked')].map(input=>input.value),pot=derive().pot;state.rounds.push({id:state.activeRound.id,kind:'winner',winner,packed,salami:mode==='salami',stake,potWon:pot});state.activeRound=null;save();closeModal();render();showResult()}
function showResult(){const last=state.rounds[state.rounds.length-1];modal(`<div class="result-banner win-glow"><div class="result-icon">♛</div><h2>${esc(playerName(last.winner))} ${last.salami?'wins with a Salami sweep':'wins the pot'}</h2><p>Deal ${state.rounds.length} recorded · returning to the table…</p></div>`);confetti();setTimeout(()=>{closeModal();render()},1500)}
function undoRound(){if(state.activeRound){cancelActiveRound();notify('Current deal cancelled.');return}if(!state.rounds.length){notify('Nothing to undo.');return}if(confirm('Undo the last deal? The ledger will replay without it.')){state.rounds.pop();render();notify('Last deal undone.')}}
function endSession(){if(state.activeRound){if(!confirm('A round is in progress. End the session without recording it?'))return;state.activeRound=null}state.screen='settlement';render()}
function finalNets(book){const nets=state.players.map(p=>({id:p.id,name:p.name,net:book.balances[p.id]}));if(book.pot&&nets.length){const share=Math.floor(book.pot/nets.length),rem=book.pot-share*nets.length;nets.forEach((p,i)=>p.net+=share+(i<rem?1:0))}return nets}
function renderSettlement(){const book=derive(),nets=finalNets(book),sum=nets.reduce((s,p)=>s+p.net,0);const lines=settle(nets);return `<div class="wrap settlement"><div class="settlement-head"><div><div class="eyebrow">Session complete · ${gameName()}</div><h1>Settle the table.</h1><div class="dash-sub">The fewest clear transfers to bring everyone home even.</div></div><button class="btn subtle" onclick="state.screen='dashboard';render()">← Back to table</button></div><section class="panel"><div class="section-title">Final balances <span class="hint">${state.rounds.length} deals · ${state.players.length} players</span></div><table class="net-table"><thead><tr><th>Player</th><th>Result</th></tr></thead><tbody>${nets.map(p=>`<tr><td>${esc(p.name)}</td><td class="${p.net>0?'positive':p.net<0?'negative':'zero'}">${p.net>0?'Receives ':p.net<0?'Owes ':''}${money(Math.abs(p.net))}</td></tr>`).join('')}</tbody></table><div class="balance-check ${sum===0?'':'bad'}">${sum===0?'✓ Net balances sum to zero.':`Net total is ${money(sum)}; check round records.`}${book.pot?` · Unclaimed board: ${money(book.pot)} (split equally among players for settlement).`:''}</div></section><section class="panel" style="margin-top:15px"><div class="section-title">Who pays whom</div>${lines.length?lines.map(x=>`<div class="pay-line">${esc(x.from)} pays ${esc(x.to)} <span class="positive">${money(x.amount)}</span></div>`).join(''):`<div class="empty">No transfers needed. Everyone is even.</div>`}<div class="settle-actions"><button class="btn primary" onclick="copySummary()">▣ Copy summary</button><button class="btn" onclick="shareSummary()">↗ Share</button><button class="btn" onclick="window.print()">⎙ Print / save PDF</button><button class="btn danger" onclick="fresh()">New session</button></div></section><div class="hint" style="margin-top:15px">Unclaimed board value stays visible here. You can return to the table and record a result before starting over.</div></div>`}
function summaryText(){const book=derive(),nets=finalNets(book),lines=settle(nets);return [`${gameName()} · Final settlement`,``,...nets.map(p=>`${p.name}: ${p.net>0?'receives ':p.net<0?'owes ':'even '}${money(Math.abs(p.net))}`),``,`Transfers:`,...(lines.length?lines.map(x=>`${x.from} pays ${x.to} ${money(x.amount)}`):['No transfers needed.']),...(book.pot?[``,`Unclaimed board split evenly: ${money(book.pot)}`]:[])].join('\n')}
async function copySummary(){try{await navigator.clipboard.writeText(summaryText());notify('Summary copied.')}catch{const t=document.createElement('textarea');t.value=summaryText();document.body.append(t);t.select();document.execCommand('copy');t.remove();notify('Summary copied.')}}
async function shareSummary(){const text=summaryText();if(navigator.share){try{await navigator.share({title:`${gameName()} settlement`,text})}catch{}}else copySummary()}
function showSettings(){modal(`<h2>Session settings</h2><p class="intro">Changes apply to future deals.</p><div class="field"><label>Stake per player</label><input class="text-input setting-edit" data-key="boot" type="number" min="0" step="1" value="${state.settings.boot}"></div><label class="toggle-row"><input id="sound-toggle" type="checkbox" ${state.sound?'checked':''}> Sound effects</label><div class="modal-actions"><button class="btn subtle" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSettings()">Save settings</button></div>`)}
function saveSettings(){document.querySelectorAll('.setting-edit').forEach(i=>state.settings[i.dataset.key]=validAmount(i.value));state.sound=document.querySelector('#sound-toggle').checked;closeModal();render();notify('Settings saved.')}
function confetti(){const canvas=document.createElement('canvas');canvas.style='position:fixed;inset:0;z-index:30;pointer-events:none';document.body.append(canvas);const c=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;const bits=Array.from({length:110},()=>({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*.3,v:2+Math.random()*4,r:3+Math.random()*4,color:['#e8bd63','#6cdb9b','#fb7780','#fff0b0'][Math.floor(Math.random()*4)],a:Math.random()*6}));let frames=0;function draw(){c.clearRect(0,0,canvas.width,canvas.height);bits.forEach(b=>{b.y+=b.v;b.x+=Math.sin(b.y/18+b.a);c.fillStyle=b.color;c.fillRect(b.x,b.y,b.r,b.r*1.7)});if(++frames<90)requestAnimationFrame(draw);else canvas.remove()}draw();if(state.sound)playSound()}
let audioContext;function playSound(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(880,audioContext.currentTime);o.frequency.exponentialRampToValueAtTime(440,audioContext.currentTime+.12);g.gain.setValueAtTime(.05,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.18);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.18)}catch{}}
function firstRender(){if(!state.players.length){state.screen='home'}else if(state.screen==='home'){}render();if(state.screen==='setup'){document.querySelector('#player-list')&&addPlayerInput();document.querySelector('#player-list')&&addPlayerInput()}}
firstRender();
</script></body></html>
