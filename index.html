transform:translateY(-6px);border-color:var(--gold)}.game-card .suit{font:54px var(--display);color:var(--gold);opacity:.88}.game-card h2{font:700 2rem var(--display);margin:12px 0 5px}.game-card p{margin:0;color:var(--muted);font-size:.9rem}.game-card:after{content:'↗';position:absolute;right:24px;bottom:20px;color:var(--gold);font-size:24px}.resume{margin:0 auto 35px;max-width:540px;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#14221d;border:1px solid #395343;border-radius:15px}.resume span{color:#b7c4bb;font-size:.85rem}.btn{border:1px solid var(--line);background:#1a2922;border-radius:12px;padding:12px 17px;font-weight:800;transition:.18s;min-height:44px}.btn:hover{border-color:var(--gold);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#edcb7e,#c89b44);border:0;color:#20190c;box-shadow:0 8px 25px #c89b4426}.btn.subtle{background:transparent;color:var(--muted)}.btn.danger{color:var(--red);border-color:#743b3d;background:#321b1d}.btn.small{padding:8px 11px;font-size:.8rem;min-height:38px}.setup{max-width:780px;margin:30px auto 70px}.setup h1,.settlement h1{font:700 clamp(2.5rem,6vw,4rem) var(--display);margin:10px 0}.setup-head{display:flex;align-items:center;gap:16px;margin-bottom:26px}.back{border-radius:50%;width:44px;height:44px;background:#13201a;border:1px solid var(--line);font-size:18px}.form-card,.panel{padding:23px;background:linear-gradient(145deg,#14221ddd,#101915f2);border:1px solid #33443a;border-radius:19px;box-shadow:var(--shadow)}.form-card+.form-card{margin-top:15px}.section-title{font-weight:800;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field label{font-size:.82rem;color:#bdc7be;font-weight:700}.field input,.player-input input,.number-input,.text-input{background:#09120f;border:1px solid #3a4a3e;border-radius:10px;color:va block;margin-top:7px;font-size:.95rem}.leader-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:17px}.leader-list{display:grid;gap:10px}.player-card{position:relative;overflow:hidden;display:grid;grid-template-columns:43px minmax(90px,1fr) auto;gap:13px;align-items:center;padding:15px 16px;background:#111b17;border:1px solid #2e4035;border-radius:16px;transition:transform .35s ease,border-color .25s}.player-card.first{border-color:#927746}.player-card.last{border-color:#743b3d}.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#f2d491;background:linear-gradient(135deg,#354334,#1f2a21);border:1px solid #53624e}.player-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-meta{font-size:.7rem;color:var(--muted);margin-top:3px}.balance{text-align:right;font:500 1.03rem var(--mono)}.positive{color:var(--green)}.negative{color:var(--red)}.zero{color:#d3d8ce}.bar{position:absolute;height:2px;left:0;bottom:0;background:linear-gradient(90deg,#be9745,#6cdb9b);transition:width .5s}.action-panel h3,.history-panel h3{font:700 1.28rem var(--display);margin:0}.action-panel p{font-size:.8rem;color:var(--muted);line-height:1.6}.action-panel .btn{width:100%;margin-top:8px}.history-panel{margin-top:18px}.history-head{display:flex;justify-content:space-between;align-items:center}.history{display:grid;gap:9px;margin-top:15px;max-height:360px;overflow-y:auto;padding-right:3px}.round-item{border:1px solid #2a3a30;background:#0c1511;border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.round-item strong{font-size:.85rem}.round-item small{display:block;color:var(--muted);font-size:.73rem;margin-top:4px}.round-amount{font:500 .82rem var(--mono);color:var(--gold);white-space:nowrap}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #39493e;border-radius:12px;font-size:.84rem}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#020706c9;backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#111c17;border:1px solid #485a47;border-radius:20px;padding:23px;box-shadow:0 30px 100px #000c}.modal h2{font:700 1.8rem var(--display);margin:0 0 6px}.modal .intro{color:var(--muted);font-size:.84rem;margin:0 0 18px}.radio-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.choice{min-height:86px;padding:14px 8px;border:1px solid #3a4b3f;border-radius:15px;background:#0b1510;text-align:center;font-size:1rem;font-weight:800;transition:.18s}.choice.selected{border-color:var(--gold);color:var(--gold);background:#2a2417;box-shadow:0 0 22px #e8bd6333;transform:translateY(-2px)}.player-select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.check-option{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #314238;border-radius:10px;background:#0c1511;font-size:.84rem}.check-option input{accent-color:#d7ae5a;width:18px;height:18px}.toggle-row{display:flex;align-items:center;gap:9px;margin:12px 0;color:#d7dfd8;font-size:.85rem}.toggle-row input{accent-color:#d7ae5a;width:18px;height:18px}.sopha-row{display:grid;grid-template-columns:1.3fr .7fr .8fr;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #26362d;font-size:.81rem}.sopha-row.head{color:var(--muted);font-size:.67rem;text-transform:uppercase;letter-spacing:.08em}.number-input{width:100%;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.breakdown{margin-top:14px;background:#0a130e;border:1px solid #35463a;border-radius:12px;padding:13px;color:#c5d0c7;font-size:.78rem;line-height:1.65}.result-banner{text-align:center;padding:30px 15px}.result-banner .result-icon{font-size:54px;color:var(--gold)}.result-banner h2{font:700 2.2rem var(--display);margin:8px}.result-banner p{color:var(--muted)}.kitty-flash{animation:shake .45s ease-in-out 2}.win-glow{animation:goldPulse 1.3s ease-in-out 2}@keyframes shake{20%,60%{transform:translateX(-8px);background:#381d1e}40%,80%{transform:translateX(8px)}}@keyframes goldPulse{50%{box-shadow:0 0 50px #e8bd6366;border-color:var(--gold)}}.settlement{max-width:900px;margin:40px auto 70px}.settlement-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.net-table{width:100%;border-collapse:collapse;margin-top:12px}.net-table th,.net-table td{text-align:left;padding:12px;border-bottom:1px solid #283a30}.net-table th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.net-table td:last-child{text-align:right;font-family:var(--mono)}.pay-line{padding:12px 14px;border:1px solid #304337;border-radius:11px;margin:8px 0;background:#0d1712;font-weight:700}.settle-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.balance-check{padding:13px;border-radius:11px;background:#13251b;color:var(--green);font-size:.83rem}.balance-check.bad{color:var(--red);background:#301719}.toast{position:fixed;z-index:40;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#e4c16d;color:#18150c;padding:11px 18px;border-radius:999px;font-weight:800;font-size:.83rem;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.checkline{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}.checkline input{accent-color:var(--gold)}.modal-scroll{max-height:55vh;overflow:auto}

<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
/* STATE */
const CURRENCY='NPR', STORAGE_KEY='felt-ledger-v1';
const DEFAULT={screen:'home',game:null,settings:{boot:10,salami:10,trio:0,rate:10,noOpen:50,ante:0},players:[],rounds:[],activeRound:null,sound:false};
let state=loadState(), toastTimer;
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));return s&&s.players?{...structuredClone(DEFAULT),...s}:structuredClone(DEFAULT)}catch{return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function fresh(){state=structuredClone(DEFAULT);save();render()}
function money(n){return `${CURRENCY} ${Math.round(Number(n)||0).toLocaleString('en-IN')}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,9)}
function notify(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function vibrate(){if(navigator.vibrate)navigator.vibrate(24)}
/* RULES ENGINE — all displayed balances are derived by replaying these events. */
function emptyLedger(){return {balances:Object.fromEntries(state.players.map(p=>[p.id,0])),won:Object.fromEntries(state.players.map(p=>[p.id,0])),paid:Object.fromEntries(state.players.map(p=>[p.id,0])),wins:Object.fromEntries(state.players.map(p=>[p.id,0])),packed:Object.fromEntries(state.players.map(p=>[p.id,0])),pot:0,kittyStreak:0,biggestPot:0,biggestPotWinner:null}}
function transfer(book,from,to,amount){amount=Math.round(amount||0);if(amount<=0)return;if(from==='pot'){book.pot-=amount}else{book.balances[from]-=amount;book.paid[from]+=amount}if(to==='pot'){book.pot+=amount}else{book.balances[to]+=amount;book.won[to]+=amount}}
function applyKittyRound(book,r){for(const p of state.players)transfer(book,p.id,'pot',state.settings.boot);if(r.kind==='kitty'){book.kittyStreak++;for(const p of state.players)transfer(book,p.id,'pot',state.settings.boot);return}book.kittyStreak=0;const pot=book.pot;transfer(book,'pot',r.winner,pot);book.wins[r.winner]++;book.biggestPot=Math.max(book.biggestPot,pot);if(pot>=book.biggestPot)book.biggestPotWinner=r.winner;for(const pid of r.packed||[])book.packed[pid]++;for(const p of state.players){if(p.id!==r.winner&&!(r.packed||[]).includes(p.id))transfer(book,p.id,r.winner,state.settings.boot+(r.trio?state.settings.trio:0))}}
// Edit this named formula to change Sopharas settlement rules.
function calculateSopharasTransfer(winnerMaal,playerMaal,opened,rate,noOpenPenalty){return opened?Math.max(0,winnerMaal-playerMaal)*rate:noOpenPenalty}
function applySopharasRound(book,r){const pot=0;book.wins[r.winner]++;let rows=[];const wm=Number(r.entries[r.winner]?.maal)||0;for(const p of state.players){if(p.id===r.winner)continue;const e=r.entries[p.id]||{opened:true,maal:0};const amount=calculateSopharasTransfer(wm,Number(e.maal)||0,!!e.opened,state.settings.rate,state.settings.noOpen);if(amount)transfer(book,p.id,r.winner,amount);rows.push({name:p.name,opened:!!e.opened,maal:Number(e.maal)||0,amount})}r._breakdown={winnerMaal:wm,rows,rate:state.settings.rate,noOpen:state.settings.noOpen,potWon:pot};book.kittyStreak=0}
function derive(){const b=emptyLedger();for(const r of state.rounds){if(state.game==='kitty')applyKittyRound(b,r);else applySopharasRound(b,r)}if(state.activeRound&&state.game==='kitty'&&!state.activeRound.bootCollected)for(const p of state.players)transfer(b,p.id,'pot',state.settings.boot);return b}
/* SETTLEMENT */
function settle(nets){let debtors=nets.filter(x=>x.net<0).map(x=>({...x,remaining:-x.net})).sort((a,b)=>b.remaining-a.remaining),creditors=nets.filter(x=>x.net>0).map(x=>({...x,remaining:x.net})).sort((a,b)=>b.remaining-a.remaining),lines=[];let i=0,j=0;while(i<debtors.length&&j<creditors.length){let amount=Math.min(debtors[i].remaining,creditors[j].remaining);if(amount>0)lines.push({from:debtors[i].name,to:creditors[j].name,amount});debtors[i].remaining-=amount;creditors[j].remaining-=amount;if(!debtors[i].remaining)i++;if(!creditors[j].remaining)j++}return lines}
/* RENDER */
function render(){save();const root=document.querySelector('#app');if(state.screen==='home')root.innerHTML=renderHome();else if(state.screen==='setup')root.innerHTML=renderSetup();else if(state.screen==='dashboard')root.innerHTML=renderDashboard();else root.innerHTML=renderSettlement();}
function renderHome(){const canResume=state.players.length&&['dashboard','settlement'].includes(state.screen)&&state.game;return `<div class="wrap"><header class="topline"><div class="brand"><span class="brand-mark">♠</span> FELT <span style="color:var(--muted);font-weight:500">/ LEDGER</span></div><span class="eyebrow">Kathmandu · Table ready</span></header><main class="hero"><div class="eyebrow">The game is in the details</div><h1>Keep score.<br><em>Settle clean.</em></h1><p>A beautiful live ledger for friendly tables. Track every boot, win and point, then leave the math to us.</p>${canResume?`<div class="resume"><div><b>Session in progress</b><br><span>${esc(gameName())} · ${state.players.length} players · ${state.rounds.length} completed rounds</span></div><button class="btn primary" onclick="resumeSession()">Resume ↗</button></div>`:''}<div class="game-grid"><button class="game-card" onclick="chooseGame('kitty')"><span class="suit">♠</span><h2>Kitti <small>किट्टी · नौ पत्ती</small></h2><p>Nau Patti · नौ पत्ती · Three-show card game</p></button><button class="game-card" onclick="chooseGame('sopharas')"><span class="suit">♦</span><h2>Sopharas <small>सोफारस</small></h2><p>Maal points, opening status &amp; clear settlement.</p></button></div><div class="hint">Money stays between friends. Cards stay on the table.</div></main></div>`}
function gameName(){return state.game==='kitty'?'Kitti · किट्टी':'Sopharas · सोफारस'}
function chooseGame(g){state.game=g;state.screen='setup';state.players=[];state.rounds=[];state.activeRound=null;render()}
function renderSetup(){const kitty=state.game==='kitty';return `<div class="wrap setup"><div class="setup-head"><button class="back" aria-label="Back to home" onclick="state.screen='home';render()">←</button><div><div class="eyebrow">Session setup · ${kitty?'01':'02'}</div><h1>${gameName()}</h1></div></div><section class="form-card"><div class="section-title">Players <span class="hint">${kitty?'2–5 players':'2 or more players'}</span></div><div id="player-list"></div><button class="btn small" onclick="addPlayerInput()">＋ Add player</button></section><section class="form-card"><div class="section-title">${kitty?'Boot / stake':'Maal settlement'}</div>${kitty?`<div class="field"><label for="boot">Boot / stake amount <span class="hint">दाउ · each player, every deal</span></label><input id="boot" type="number" min="0" step="1" value="${state.settings.boot}" oninput="state.settings.boot=validAmount(this.value);markChip()"><div class="chips">${[5,10,20,50,100].map(x=>`<button class="chip ${Number(state.settings.boot)===x?'active':''}" onclick="setSetupAmount('boot',${x})">${x}</button>`).join('')}</div></div>`:`<div class="field-grid"><div class="field"><label>Rate per Maal point</label><input id="rate" type="number" min="0" step="1" value="${state.settings.rate}" onchange="state.settings.rate=validAmount(this.value)"></div><div class="field"><label>Did not open penalty</label><input id="noOpen" type="number" min="0" step="1" value="${state.settings.noOpen}" onchange="state.settings.noOpen=validAmount(this.value)"></div></div><div class="hint" style="margin-top:12px">One winner per round. No ante or board contribution is collected.</div>`}</section>${kitty?`<section class="form-card"><div class="section-title">Table rules</div><div class="field-grid"><div class="field"><label>Base payment per non-packed loser</label><div class="text-input" aria-live="polite">${money(state.settings.boot)}</div><span class="hint">Automatically matches the editable boot / stake amount.</span></div><div class="field"><label>Trio bonus per non-packed loser</label><input type="number" min="0" step="1" value="${state.settings.trio}" onchange="state.settings.trio=validAmount(this.value)"><span class="hint">Only when the winner takes all three shows (Salami).</span></div></div></section>`:''}<div class="start-row"><button class="btn primary" onclick="startSession()">Start session <span aria-hidden="true">→</span></button></div></div>`}
function addPlayerInput(name=''){const list=document.querySelector('#player-list');if(!list)return;const row=document.createElement('div');row.className='player-input';row.innerHTML=`<input class="text-input" placeholder="Player name" maxlength="24" value="${esc(name)}" aria-label="Player name"><button class="remove-player" aria-label="Remove player" onclick="this.parentElement.remove()">×</button>`;list.append(row)}
function validAmount(v){const n=Number(v);return Number.isFinite(n)&&n>=0?Math.round(n):0}
function setSetupAmount(key,v){state.settings[key]=v;render()}
function markChip(){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',Number(x.textContent)===Number(state.settings.boot)))}
function startSession(){const names=[...document.querySelectorAll('.player-input input')].map(i=>i.value.trim());const min=state.game==='kitty'?2:2,max=state.game==='kitty'?5:Infinity;if(names.length<min||names.length>max){notify(`Add ${min}${max===Infinity?' or more':` to ${max}`} players.`);return}if(names.some(n=>!n)){notify('Every player needs a name.');return}if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){notify('Player names must be unique.');return}for(const k of Object.keys(state.settings))state.settings[k]=validAmount(state.settings[k]);state.players=names.map(name=>({id:id(),name}));state.rounds=[];state.activeRound=null;state.screen='dashboard';save();render()}
function resumeSession(){state.screen='dashboard';render()}
function renderDashboard(){const book=derive(),ranked=state.players.slice().sort((a,b)=>book.balances[b.id]-book.balances[a.id]),max=Math.max(1,...ranked.map(p=>Math.abs(book.balances[p.id]))),leader=ranked[0],loser=ranked[ranked.length-1];return `<div class="dashbar"><div class="wrap dashbar-inner"><div class="brand"><span class="brand-mark">${state.game==='kitty'?'♠':'♦'}</span></div><div class="dash-title"><strong>${gameName()}</strong><small>Round ${state.rounds.length+1}</small></div><div class="pot"><small>Board / Pot</small><b>${money(book.pot)}</b></div><div class="dash-actions"><button class="icon-btn" aria-label="Undo last round" title="Undo last round" onclick="undoRound()">↶</button><button class="icon-btn" aria-label="Settings" title="Settings" onclick="showSettings()">⚙</button><button class="btn small" onclick="endSession()">End session</button></div></div></div><main class="wrap dashboard-main"><h1>The table</h1><div class="dash-sub">${state.rounds.length?`Live after ${state.rounds.length} ${state.rounds.length===1?'round':'rounds'}. Ledger updates as each result lands.`:'Session is ready. Start the first round when the table is set.'}</div><div class="stats"><div class="stat"><small>Biggest pot won</small><b>${money(book.biggestPot)}</b></div><div class="stat"><small>Kitty streak</small><b>${book.kittyStreak} ${book.kittyStreak===1?'round':'rounds'}</b></div><div class="stat"><small>Current winner</small><b>${leader&&book.balances[leader.id]>0?esc(leader.name):'—'}</b></div><div class="stat"><small>Largest amount owed</small><b>${loser&&book.balances[loser.id]<0?esc(loser.name):'—'}</b></div></div><div class="leader-layout"><section><div class="leader-list">${ranked.map((p,i)=>{const b=book.balances[p.id],width=Math.max(7,Math.abs(b)/max*100);return `<article class="player-card ${i===0?'first':''} ${i===ranked.length-1&&ranked.length>1?'last':''}"><div class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div><div class="player-name">${i===0?'♛ ':''}${i===ranked.length-1&&ranked.length>1?'♨ ':''}${esc(p.name)}</div><div class="player-meta">Won ${money(book.won[p.id])} · Paid ${money(book.paid[p.id])} · ${book.wins[p.id]} wins · ${book.packed[p.id]} packed</div></div><div class="balance ${b>0?'positive':b<0?'negative':'zero'}">${b>0?'+':''}${money(b)}</div><div class="bar" style="width:${width}%"></div></article>`}).join('')}</div></section><aside class="panel action-panel"><div class="eyebrow">Next move</div><h3>${state.activeRound?'Outcome entry is open':'Ready for a round?'}</h3><p>${state.activeRound?'Choose the result below and confirm to update the ledger.':state.game==='kitty'?'Everyone contributes the boot to the board before the hand.':'Each hand has one winner. No ante is collected.'}</p><button class="btn primary" onclick="newRound()">＋ New round</button><button class="btn subtle" onclick="endSession()">End session</button></aside></div><section class="panel history-panel"><div class="history-head"><h3>Round history</h3><span class="hint">${state.rounds.length} recorded</span></div><div class="history">${state.rounds.length?state.rounds.slice().reverse().map((r,rev)=>historyCard(r,state.rounds.length-rev)).join(''):`<div class="empty">No rounds yet. The first hand starts the story.</div>`}</div></section></main>`}
function historyCard(r,num){if(state.game==='kitty')return `<article class="round-item"><div><strong>Round ${num} · ${r.kind==='kitty'?'Kitti — pot carried over':`Winner: ${esc(playerName(r.winner))}`}</strong><small>${r.kind==='kitty'?'No winner. One additional boot / stake collected from each player into the carried pot.':`Packed: ${(r.packed||[]).length?(r.packed||[]).map(playerName).map(esc).join(', '):'none'}${r.trio?' · Trio sweep':''}`}</small></div><div class="round-amount">${r.kind==='kitty'?'↻ '+money(state.settings.boot*state.players.length):'↑ '+money(r.potWon||0)}</div></article>`;const d=r._breakdown||{};return `<article class="round-item"><div><strong>Round ${num} · Winner: ${esc(playerName(r.winner))}</strong><small>${(d.rows||[]).map(x=>`${esc(x.name)} ${x.opened?'opened':'did not open'} · ${x.opened?x.maal+' Maal':'penalty'}`).join(' / ')||'Sopharas round recorded'}</small><div class="breakdown">${(d.rows||[]).map(x=>`<div>${esc(x.name)}: ${x.opened?`max(${d.winnerMaal} − ${x.maal}, 0) × ${d.rate} = ${money(x.amount)}`:`did not open → ${money(x.amount)}`}</div>`).join('')}<div>Winner takes pot: ${money(d.potWon||0)}</div></div></div><div class="round-amount">↑ ${money((d.rows||[]).reduce((s,x)=>s+x.amount,0)+(d.potWon||0))}</div></article>`}
function playerName(pid){return state.players.find(p=>p.id===pid)?.name||'Unknown'}
function newRound(){if(state.activeRound){openOutcome();return}state.activeRound={id:id(),startedAt:Date.now(),bootCollected:state.game==='kitty'};save();render();vibrate();openOutcome()}
function cancelActiveRound(){state.activeRound=null;render()}
function openOutcome(){if(document.querySelector('#modal-backdrop'))return;if(!state.activeRound){notify('Start a new round first.');return}if(state.game==='kitty')kittyModal();else sopharasModal()}
function modal(html){const el=document.createElement('div');el.className='modal-backdrop';el.id='modal-backdrop';el.innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}</section>`;el.addEventListener('click',e=>{if(e.target===el)el.remove()});document.body.append(el)}
function closeModal(){document.querySelector('#modal-backdrop')?.remove()}
function kittyModal(){modal(`<h2>How did it land?</h2><p class="intro">Choose the result for round ${state.rounds.length+1}.</p><div class="radio-row"><button class="choice selected" id="winner-choice" onclick="selectOutcomeMode('winner')">♛<br>Winner<br><small>विजेता</small></button><button class="choice" id="kitty-choice" onclick="selectOutcomeMode('kitty')">♧<br>Kitti<br><small>किट्टी</small></button><button class="choice" id="salami-choice" onclick="selectOutcomeMode('salami')">✦<br>Salami<br><small>सलामी</small></button></div><div id="outcome-fields">${kittyFields()}</div><div class="modal-actions"><button class="btn subtle" onclick="closeModal()">Cancel</button><button class="btn primary" id="confirm-outcome" onclick="confirmKittyOutcome()">Confirm result</button></div>`)}
function kittyFields(){return `<div class="field"><label>Winner</label><select id="winner" class="text-input" style="width:100%">${state.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div style="margin-top:17px"><div class="section-title">Who folded? (packed)</div><div class="player-select-grid">${state.players.map(p=>`<label class="check-option"><input type="checkbox" value="${p.id}" class="packed-check" onchange="validatePacked()"> ${esc(p.name)}</label>`).join('')}</div></div><label class="trio-toggle"><input type="checkbox" id="trio-check"><span><b>Winner swept all three shows</b><small>Apply the extra three-show sweep amount to each non-packed loser.</small></span></label><div id="packed-warning" class="hint"></div>`}
function selectOutcomeMode(mode){document.querySelector('#winner-choice').classList.toggle('selected',mode==='winner');document.querySelector('#kitty-choice').classList.toggle('selected',mode==='kitty');document.querySelector('#salami-choice').classList.toggle('selected',mode==='salami');const fields=document.querySelector('#outcome-fields'),confirm=document.querySelector('#confirm-outcome');if(mode==='kitty'){fields.innerHTML=`<div class="empty kitty-flash">Kitti draw: ${money(state.settings.boot)} boot / stake is added from each player to the carried pot.</div>`;confirm.textContent='Record Kitty';setTimeout(()=>{if(document.querySelector('#kitty-choice')?.classList.contains('selected'))confirmKittyOutcome()},500)}else if(mode==='salami'){fields.innerHTML=`<div class="empty">Each non-packed loser pays ${money(state.settings.boot)} base amount directly to the winner. Select the winner and packed players below.</div>${kittyFields()}`;confirm.textContent='Confirm Salami result';document.querySelector('#trio-check').checked=true}else{fields.innerHTML=kittyFields();confirm.textContent='Confirm result'}}
function validatePacked(){const winner=document.querySelector('#winner')?.value,checked=[...document.querySelectorAll('.packed-check:checked')];const invalid=checked.some(c=>c.value===winner);document.querySelector('#packed-warning').textContent=invalid?'The winner cannot be marked as packed.':'';return !invalid}
function confirmKittyOutcome(){const kitty=document.querySelector('#kitty-choice').classList.contains('selected');if(!kitty&&!validatePacked())return;if(kitty){state.rounds.push({id:state.activeRound.id,kind:'kitty',potBefore:derive().pot});state.activeRound.bootCollected=true;}else{const winner=document.querySelector('#winner').value,packed=[...document.querySelectorAll('.packed-check:checked')].map(c=>c.value),pot=derive().pot;state.rounds.push({id:state.activeRound.id,kind:'winner',winner,packed,trio:document.querySelector('#trio-check').checked,potWon:pot})}closeModal();if(kitty){save();render();openOutcome();notify(`Kitti recorded · ${money(state.settings.boot)} added from each player. Pot carries into the next deal.`);return}state.activeRound=null;save();render();showResult(false)}
function sopharasModal(){modal(`<h2>Who closed the game?</h2><p class="intro">Enter each player’s opening status and Maal points. Winner’s Maal is included below.</p><div class="field"><label>Winner</label><select id="winner" class="text-input" style="width:100%" onchange="renderSophaRows()">${state.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="sopha-row head"><span>Player</span><span>Opened?</span><span>Maal points</span></div><div id="sopha-rows" class="modal-scroll">${sophaRows()}</div><div class="modal-actions"><button class="btn subtle" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmSopharas()">Review calculation</button></div>`)}
function sophaRows(){const winner=document.querySelector('#winner')?.value||state.players[0]?.id;return state.players.map(p=>`<div class="sopha-row ${p.id===winner?'hidden':''}" data-pid="${p.id}"><span>${esc(p.name)}${p.id===winner?' · winner':''}</span><span>${p.id===winner?'—':`<select class="number-input opened-input" aria-label="Did ${esc(p.name)} open?"><option value="yes">Yes</option><option value="no">No</option></select>`}</span><span><input class="number-input maal-input" aria-label="${esc(p.name)} Maal points" type="number" min="0" step="1" value="0"></span></div>`).join('')}
function renderSophaRows(){document.querySelector('#sopha-rows').innerHTML=sophaRows()}
function confirmSopharas(){const winner=document.querySelector('#winner').value,entries={};for(const p of state.players){const row=document.querySelector(`[data-pid="${p.id}"]`);entries[p.id]={opened:p.id===winner?true:row.querySelector('.opened-input').value==='yes',maal:validAmount(row.querySelector('.maal-input').value)}}const r={id:state.activeRound.id,kind:'sopharas',winner,entries};const book=derive();applySopharasRound(book,r);const d=r._breakdown;const breakdown=`<div class="breakdown"><b>${esc(playerName(winner))} wins</b><br>${d.rows.map(x=>`${esc(x.name)}: ${x.opened?`max(${d.winnerMaal} − ${x.maal}, 0) × ${d.rate} = ${money(x.amount)}`:`did not open → ${money(x.amount)}`}`).join('<br>')}<br>Winner takes pot: ${money(d.potWon)}</div>`;modal(`<h2>Round calculation</h2><p class="intro">Confirm the transfers below.</p>${breakdown}<div class="modal-actions"><button class="btn subtle" onclick="sopharasModal()">Edit</button><button class="btn primary" onclick="saveSopharas(${JSON.stringify(JSON.stringify(r))})">Confirm round</button></div>`)}
function saveSopharas(serialized){const r=JSON.parse(serialized);state.rounds.push(r);state.activeRound=null;save();closeModal();render();showResult(false)}
function showResult(kitty){const book=derive(),last=state.rounds[state.rounds.length-1];modal(`<div class="result-banner ${kitty?'kitty-flash':'win-glow'}"><div class="result-icon">${kitty?'♧':'♛'}</div><h2>${kitty?'KITTY! Pot carried over':`${esc(playerName(last.winner))} takes the round`}</h2><p>${kitty?`Board now holds ${money(book.pot)}.`:`Round ${state.rounds.length} is in the ledger.`}</p><button class="btn primary" onclick="closeModal()">Back to table</button></div>`);if(!kitty)confetti();else vibrate()}
function undoRound(){if(state.activeRound){cancelActiveRound();notify('Current round cancelled.');return}if(!state.rounds.length){notify('Nothing to undo.');return}if(confirm('Undo the last round? The ledger will replay without it.')){state.rounds.pop();render();notify('Last round undone.')}}
function endSession(){if(state.activeRound){if(!confirm('A round is in progress. End the session without recording it?'))return;state.activeRound=null}state.screen='settlement';render()}
function finalNets(book){const nets=state.players.map(p=>({id:p.id,name:p.name,net:book.balances[p.id]}));if(book.pot&&nets.length){const share=Math.floor(book.pot/nets.length),rem=book.pot-share*nets.length;nets.forEach((p,i)=>p.net+=share+(i<rem?1:0))}return nets}
function renderSettlement(){const book=derive(),nets=finalNets(book),sum=nets.reduce((s,p)=>s+p.net,0);const lines=settle(nets);return `<div class="wrap settlement"><div class="settlement-head"><div><div class="eyebrow">Session complete · ${gameName()}</div><h1>Settle the table.</h1><div class="dash-sub">The fewest clear transfers to bring everyone home even.</div></div><button class="btn subtle" onclick="state.screen='dashboard';render()">← Back to table</button></div><section class="panel"><div class="section-title">Final balances <span class="hint">${state.rounds.length} rounds · ${state.players.length} players</span></div><table class="net-table"><thead><tr><th>Player</th><th>Result</th></tr></thead><tbody>${nets.map(p=>`<tr><td>${esc(p.name)}</td><td class="${p.net>0?'positive':p.net<0?'negative':'zero'}">${p.net>0?'Receives ':p.net<0?'Owes ':''}${money(Math.abs(p.net))}</td></tr>`).join('')}</tbody></table><div class="balance-check ${sum===0?'':'bad'}">${sum===0?'✓ Net balances sum to zero.':`Net total is ${money(sum)}; check round records.`}${book.pot?` · Unclaimed board: ${money(book.pot)} (split equally among players for settlement).`:''}</div></section><section class="panel" style="margin-top:15px"><div class="section-title">Who pays whom</div>${lines.length?lines.map(x=>`<div class="pay-line">${esc(x.from)} pays ${esc(x.to)} <span class="positive">${money(x.amount)}</span></div>`).join(''):`<div class="empty">No transfers needed. Everyone is even.</div>`}<div class="settle-actions"><button class="btn primary" onclick="copySummary()">▣ Copy summary</button><button class="btn" onclick="shareSummary()">↗ Share</button><button class="btn" onclick="window.print()">⎙ Print / save PDF</button><button class="btn danger" onclick="fresh()">New session</button></div></section><div class="hint" style="margin-top:15px">Unclaimed board value stays visible here. You can return to the table and record a result before starting over.</div></div>`}
function summaryText(){const book=derive(),nets=finalNets(book),lines=settle(nets);return [`${gameName()} · Final settlement`,``,...nets.map(p=>`${p.name}: ${p.net>0?'receives ':p.net<0?'owes ':'even '}${money(Math.abs(p.net))}`),``,`Transfers:`,...(lines.length?lines.map(x=>`${x.from} pays ${x.to} ${money(x.amount)}`):['No transfers needed.']),...(book.pot?[``,`Unclaimed board split evenly: ${money(book.pot)}`]:[])].join('\n')}
async function copySummary(){try{await navigator.clipboard.writeText(summaryText());notify('Summary copied.')}catch{const t=document.createElement('textarea');t.value=summaryText();document.body.append(t);t.select();document.execCommand('copy');t.remove();notify('Summary copied.')}}
async function shareSummary(){const text=summaryText();if(navigator.share){try{await navigator.share({title:`${gameName()} settlement`,text})}catch{}}else copySummary()}
function showSettings(){modal(`<h2>Session settings</h2><p class="intro">Changes apply to future rounds.</p><div class="field-grid">${(state.game==='kitty'?[['boot','Boot / stake'],['trio','Salami sweep bonus']]:[['ante','Ante'],['rate','Rate per Maal point'],['noOpen','Did not open penalty']]).map(([k,label])=>`<div class="field"><label>${label}</label><input class="text-input setting-edit" data-key="${k}" type="number" min="0" step="1" value="${state.settings[k]}"></div>`).join('')}</div><div class="field" style="margin-top:14px"><label class="toggle-row"><input id="sound-toggle" type="checkbox" ${state.sound?'checked':''}> Sound effects</label></div><div class="modal-actions"><button class="btn subtle" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSettings()">Save settings</button></div>`)}
function saveSettings(){document.querySelectorAll('.setting-edit').forEach(i=>state.settings[i.dataset.key]=validAmount(i.value));state.sound=document.querySelector('#sound-toggle').checked;closeModal();render();notify('Settings saved.')}
function confetti(){const canvas=document.createElement('canvas');canvas.style='position:fixed;inset:0;z-index:30;pointer-events:none';document.body.append(canvas);const c=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;const bits=Array.from({length:110},()=>({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*.3,v:2+Math.random()*4,r:3+Math.random()*4,color:['#e8bd63','#6cdb9b','#fb7780','#fff0b0'][Math.floor(Math.random()*4)],a:Math.random()*6}));let frames=0;function draw(){c.clearRect(0,0,canvas.width,canvas.height);bits.forEach(b=>{b.y+=b.v;b.x+=Math.sin(b.y/18+b.a);c.fillStyle=b.color;c.fillRect(b.x,b.y,b.r,b.r*1.7)});if(++frames<90)requestAnimationFrame(draw);else canvas.remove()}draw();if(state.sound)playSound()}
let audioContext;function playSound(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(880,audioContext.currentTime);o.frequency.exponentialRampToValueAtTime(440,audioContext.currentTime+.12);g.gain.setValueAtTime(.05,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.18);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.18)}catch{}}
function firstRender(){if(!state.players.length){state.screen='home'}else if(state.screen==='home'){}render();if(state.screen==='setup'){document.querySelector('#player-list')&&addPlayerInput();document.querySelector('#player-list')&&addPlayerInput()}}
firstRender();
</script></body></html>
